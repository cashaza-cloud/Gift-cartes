<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur de Cartes Cadeaux - Cashaza</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .conteneur { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #333; font-size: 22px; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { background-color: #7c3aed; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #6d28d9; }
    </style>
</head>
<body>

<div class="conteneur">
    <h1>Achat de Cartes Cadeaux</h1>
    
    <!-- Ton champ pour choisir la quantité -->
    <div class="form-group">
        <label for="quantite">Nombre de cartes cadeaux :</label>
        <input type="number" id="quantite" value="1" min="1">
    </div>

    <!-- Le bouton de paiement -->
    <button id="btn-payer" onclick="payerAvecLemonSqueezy()">
        Payer maintenant
    </button>
</div>

<script>
function payerAvecLemonSqueezy() {
    // Récupère la quantité entrée par le client
    let quantite = document.getElementById('quantite').value;
    
    // Ton lien direct Lemon Squeezy avec ton ID de produit
    let lienBase = "https://renxcashaza.lemonsqueezy.com/checkout/buy/85bd5ac3-7f3f-4476-9774-5701c3f76be0";
    
    // Ajoute le paramètre de quantité à l'URL de Lemon Squeezy
    let lienFinal = lienBase + "?quantity=" + quantite;
    
    // Redirige le client vers la page de paiement Lemon Squeezy
    window.location.href = lienFinal;
}
</script>

</body>
  </html>
