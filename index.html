<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Cashaza</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #111;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #7c3aed;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #6d28d9;
        }
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Boutique Cashaza</h2>
    
    <label for="offerSelect">Choisissez votre offre :</label>
    <select id="offerSelect">
        <option value="unit">Clés à l'unité (0,75 €)</option>
        <option value="sub">Clés illimitées (125 €/mois)</option>
    </select>

    <label for="quantityInput">Nombre de clés :</label>
    <input type="number" id="quantityInput" value="1" min="1">

    <button id="payBtn">Procéder au paiement</button>

    <hr style="margin: 30px 0;">

    <h2>Personnalise ta carte cadeau physique</h2>
    
    <label for="fileInput">Image pour la carte (PNG/JPG) :</label>
    <input type="file" id="fileInput" accept="image/png, image/jpeg">

    <label for="emailInput">Votre courriel :</label>
    <input type="emailInput" id="emailInput" placeholder="exemple@email.com">

    <button id="submitBtn">Commander ma carte</button>
    
    <div id="statusMessage"></div>
</div>

<script>
    const submitBtn = document.getElementById('submitBtn');
    const fileInput = document.getElementById('fileInput');
    const emailInput = document.getElementById('emailInput');
    const statusMessage = document.getElementById('statusMessage');

    submitBtn.addEventListener('click', async () => {
        const file = fileInput.files[0];
        const email = emailInput.value;

        if (!file) {
            statusMessage.style.color = "#ef4444";
            statusMessage.innerText = "Sélectionne une image.";
            return;
        }

        if (!email) {
            statusMessage.style.color = "#ef4444";
            statusMessage.innerText = "Entre une adresse courriel valide.";
            return;
        }

        try {
            submitBtn.disabled = true;
            statusMessage.style.color = "#4b5563";
            statusMessage.innerText = "Upload de l'image en cours...";

            // Simulation ou traitement de l'envoi
            setTimeout(() => {
                statusMessage.style.color = "#10b981";
                statusMessage.innerText = "Commande validée avec succès !";
                submitBtn.disabled = false;
            }, 1500);

        } catch (err) {
            console.error(err);
            statusMessage.style.color = "#ef4444";
            statusMessage.innerText = "Erreur : " + err.message;
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
