<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - Cartes-cadeaux</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1119311529549871"
     crossorigin="anonymous"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #161616;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #212121;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .groupe-formulaire {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0b0;
        }

        select, input {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: #007aff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #0062cc;
        }

        button:active {
            transform: scale(0.98);
        }

        .texte-de-pivot {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Boutique Cashaza</h1>
        
        <form id="form-paiement">
            <div class="groupe-formulaire">
                <label for="produit">Choisissez votre offre</label>
                <select id="produit" name="produit" onchange="changerProduit()">
                    <option value="1">Carte-cadeau 1 € (100 pièces)</option>
                    <option value="5">Carte-cadeau 5 € (500 pièces) - Affiliation: 5%</option>
                </select>
            </div>

            <div class="groupe-formulaire">
                <label for="quantite">Quantité</label>
                <input type="number" id="quantite" name="quantite" value="1" min="1">
            </div>

            <div class="groupe-formulaire">
                <label for="identifiant">Identifiant / E-mail de compte</label>
                <input type="text" id="identifiant" name="identifiant" placeholder="votre-email@exemple.com" required>
            </div>

            <button type="submit" id="bouton-soumettre">Procéder au paiement</button>
            <div class="texte-de-pivot" id="statut-message"></div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'VOTRE_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'VOTRE_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function changerProduit() {
            // Logique de changement de produit dynamique
        }

        const form = document.getElementById('form-paiement');
        const statutMessage = document.getElementById('statut-message');
        const boutonSoumettre = document.getElementById('bouton-soumettre');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            boutonSoumettre.disabled = true;
            statutMessage.textContent = "Création de la commande en cours...";

            const produit = document.getElementById('produit').value;
            const quantite = document.getElementById('quantite').value;
            const identifiant = document.getElementById('identifiant').value;

            try {
                const response = await fetch('https://hook.eu1.make.com/webhook-hook-id', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ produit, quantite, identifiant })
                });

                if (response.ok) {
                    statutMessage.textContent = "Commande validée avec succès !";
                    form.reset();
                } else {
                    statutMessage.textContent = "Erreur lors de la création";
                    boutonSoumettre.disabled = false;
                }
            } catch (error) {
                statutMessage.textContent = "Erreur réseau";
                boutonSoumettre.disabled = false;
            }
        });
    </script>
</body>
</html>
