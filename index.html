<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achat de Cartes Cadeaux - Cashaza</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .conteneur {
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4b5563;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #7c3aed;
        }
        button {
            background-color: #7c3aed;
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #6d28d9;
        }
        button:active {
            transform: scale(0.98);
        }
        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="conteneur">
    <h1>Boutique Cashaza</h1>
    
    <div class="form-group">
        <label for="quantite">Nombre de clés / cartes :</label>
        <input type="number" id="quantite" value="1" min="1">
    </div>

    <button id="btn-payer" onclick="payerAvecLemonSqueezy()">
        Procéder au paiement
    </button>
    
    <div class="footer-text">Paiements sécurisés via Lemon Squeezy</div>
</div>

<script>
function payerAvecLemonSqueezy() {
    let quantite = document.getElementById('quantite').value;
    let lienBase = "https://renxcashaza.lemonsqueezy.com/checkout/buy/85bd5ac3-7f3f-4476-9774-5701c3f76be0";
    let lienFinal = lienBase + "?quantity=" + quantite;
    window.location.href = lienFinal;
}
</script>

</body>
</html>
